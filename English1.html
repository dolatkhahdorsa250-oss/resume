<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet" />
<style>
  :root{
    --bg:#F7F5F0;
    --paper:#FCFBF8;
    --ink:#1E2023;
    --ink-soft:#5B5E63;
    --ink-faint:#8B8E93;
    --rule:#DEDAD0;
    --accent:#2B5D62;
    --accent-soft:#2B5D6212;
    --accent2:#8C6A2F;
    --serif:'Source Serif 4', Georgia, serif;
    --sans:'Inter', Helvetica, Arial, sans-serif;
    --mono:'IBM Plex Mono', 'Fira Mono', monospace;
  }
  *{box-sizing:border-box;}
  html{-webkit-font-smoothing:antialiased;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.55;
  }
  a{color:var(--accent); text-decoration:none; border-bottom:1px solid transparent;}
  a:hover, a:focus{border-bottom-color:var(--accent);}
  a:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px;}

  .wrap{
    max-width:900px;
    margin:0 auto;
    padding:2.5rem 1.25rem 3rem;
  }

  .back{
    font-family:var(--mono);
    font-size:.78rem;
    color:var(--ink-soft);
    display:inline-flex;
    align-items:center;
    gap:.4rem;
    margin-bottom:1.75rem;
  }
  .back:hover{color:var(--accent);}

  header{
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    align-items:flex-end;
    gap:1rem;
    border-bottom:1px solid var(--rule);
    padding-bottom:1.25rem;
    margin-bottom:1.5rem;
  }
  header h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:1.7rem;
    margin:0 0 .2rem;
    letter-spacing:-0.01em;
  }
  header p{
    margin:0;
    color:var(--ink-soft);
    font-size:.92rem;
  }

  .actions{
    display:flex;
    gap:.6rem;
    flex-wrap:wrap;
  }
  .btn{
    font-family:var(--mono);
    font-size:.76rem;
    letter-spacing:.03em;
    text-transform:uppercase;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--rule);
    border-radius:3px;
    padding:.5rem .85rem;
    display:inline-flex;
    align-items:center;
    gap:.45rem;
    transition:border-color .15s ease, background .15s ease;
  }
  .btn:hover{border-color:var(--accent); background:var(--accent-soft);}
  .btn.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  .btn.primary:hover{background:#234a4e;}

  .viewer{
    background:var(--paper);
    border:1px solid var(--rule);
    border-radius:6px;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(0,0,0,.03);
    padding:1.25rem;
    text-align:center;
  }
  .viewer img{
    max-width:100%;
    height:auto;
    display:block;
    margin:0 auto;
    border-radius:2px;
  }

  .meta{
    margin-top:1.25rem;
    font-size:.85rem;
    color:var(--ink-soft);
  }
  .meta strong{color:var(--ink); font-weight:600;}

  footer{
    text-align:center;
    padding-top:2.5rem;
    color:var(--ink-faint);
    font-size:.85rem;
  }
  footer a{color:var(--ink-soft);}

  @media (max-width:600px){
    header{flex-direction:column; align-items:flex-start;}
  }
</style>
</head>
<body>
<div class="wrap">

  <a class="back" href="../index.html"><i class="fa-solid fa-arrow-left"></i> Back to profile</a>

  <header>
    <div>
      <h1>International Language Proficiency Certificate</h1>
      <p>Achievement of Advanced Level English Certification</p>
    </div>
    <div class="actions">
      <a class="btn" href="English1.jpg" target="_blank" rel="noopener"><i class="fa-solid fa-up-right-from-square"></i> Open in new tab</a>
      <a class="btn primary" href="English1.jpg" download><i class="fa-solid fa-download"></i> Download image</a>
    </div>
  </header>

  <div class="viewer">
    <img src="English1.jpg" alt="English1.jpg" />
  </div>

  <p class="meta">Issued by the <strong>Safir Language Academy</strong> <strong></strong>.</p>

  <footer>
    For more information, please <a href="mailto:dolatkhahdorsa250@gmail.com">get in touch</a>.
  </footer>

</div>
</body>
</html>
